[project]
name = "canvasproject"
version = "0.1.0"
description = "Personal Discord bot that shows your Canvas courses, grades, and upcoming assignments."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1",
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
    "tzdata>=2026.5",
]

[project.scripts]
canvasproject = "canvasproject:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
